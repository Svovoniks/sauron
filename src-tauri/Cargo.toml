[package]
name = "sauron"
version = "0.4.9"
description = "database query app"
authors = ["svovoniks"]
edition = "2021"
license = "MIT"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sauron_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "sync", "time", "fs"] }
tokio-postgres = "0.7.14"
native-tls = "0.2"
postgres-native-tls = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
uuid = { version = "1", features = ["v4"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "vendored"] }
tauri-plugin-updater = "~2.9"
# where `sauron --mcp` finds the app data without a running Tauri app (see src/mcp.rs)
dirs = "6"

# macOS keeps passwords in an encrypted file instead of the keychain (see src/secrets/vault.rs)
[target.'cfg(target_os = "macos")'.dependencies]
aes-gcm = "0.10"
sha2 = "0.10"
