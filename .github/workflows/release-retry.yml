name: Release retry

# GitHub sometimes cannot find a hosted macOS runner for a release build ("The job was not acquired by Runner of
# type hosted even after multiple attempts"). The build is then cancelled, publish-release is skipped and the
# release stays a draft. This re-runs the cancelled jobs of such a run; publish-release runs again with them and
# publishes the release once every platform has uploaded.
#
# Only runs that failed because jobs were cancelled are retried: a real failure (a failing test, a broken build)
# and a run cancelled by hand are left alone.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]

jobs:
  rerun:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-22.04
    permissions:
      actions: write
    steps:
      - name: re-run builds that never got a runner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          jobs=$(gh api "repos/$REPO/actions/runs/$RUN_ID/attempts/$ATTEMPT/jobs?per_page=100")
          failed=$(jq '[.jobs[] | select(.conclusion == "failure")] | length' <<< "$jobs")
          cancelled=$(jq '[.jobs[] | select(.conclusion == "cancelled")] | length' <<< "$jobs")
          echo "attempt $ATTEMPT: $failed failed, $cancelled cancelled"
          if [ "$failed" -gt 0 ] || [ "$cancelled" -eq 0 ]; then
            echo "not a runner problem, nothing to retry"
            exit 0
          fi
          gh run rerun "$RUN_ID" --failed --repo "$REPO"
