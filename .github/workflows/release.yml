name: Release

# Releases are cut from tags:  git tag app-v0.2.2 && git push origin app-v0.2.2
# (bump the version in package.json AND src-tauri/Cargo.toml first - CI checks that they match).
on:
  push:
    tags: ['app-v*']

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  tag-matches-version:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: tag must be app-v<package.json version>
        run: |
          npm_version=$(grep -m1 '"version"' package.json | sed -E 's/.*"version": *"([^"]+)".*/\1/')
          echo "tag=${GITHUB_REF_NAME} package.json=app-v${npm_version}"
          test "${GITHUB_REF_NAME}" = "app-v${npm_version}"

  publish-tauri:
    needs: [check, tag-matches-version]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # for Arm based macs (M1 and above).
            args: '--target aarch64-apple-darwin --config src-tauri/tauri.codesign.conf.json'
          - platform: 'macos-latest' # for Intel based macs.
            args: '--target x86_64-apple-darwin --config src-tauri/tauri.codesign.conf.json'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: oven-sh/setup-bun@v2

      - name: install frontend dependencies
        run: bun install --frozen-lockfile

      # Sign the macOS app with a fixed self-signed certificate instead of ad-hoc ("-"). An ad-hoc signature changes with every
      # build, so macOS asks for the keychain password again after each update; a fixed certificate keeps "Always Allow" working.
      # Secrets: MACOS_CODESIGN_P12 (base64 of the .p12) and MACOS_CODESIGN_P12_PASSWORD. See "macOS keychain prompts" in the README.
      - name: import code-signing certificate (macOS only)
        if: matrix.platform == 'macos-latest'
        env:
          P12_BASE64: ${{ secrets.MACOS_CODESIGN_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CODESIGN_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/sauron-sign.keychain-db"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/sauron.p12"
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p ci "$KC"
          security import "$RUNNER_TEMP/sauron.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          # codesign only accepts identities that are trusted for code signing, and a self-signed one is not until we say so
          security find-certificate -c "Sauron Self-Signed" -p "$KC" > "$RUNNER_TEMP/sauron-cert.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/sauron-cert.pem"
          security find-identity -v -p codesigning | grep "Sauron Self-Signed"

      - uses: tauri-apps/tauri-action@v0.5.23
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=8192
          # Signs the update bundles (see "Updates" in the README); the public half is in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'App ${{ github.ref_name }}'
          releaseBody: 'See the assets to download this version and install.'
          # Review the draft, then publish it by hand.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
